services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quitting7oh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      args:
        CORP_BASE: ${CORP_BASE:-base-clean}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/quitting7oh?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma db push --skip-generate
    restart: "no"

  web:
    build:
      context: .
      args:
        CORP_BASE: ${CORP_BASE:-base-clean}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/quitting7oh?schema=public
      ARCHIVE_DIR: /data/archive
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - archive_data:/data/archive:ro
    command: npm run start

  bot:
    build:
      context: .
      args:
        CORP_BASE: ${CORP_BASE:-base-clean}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/quitting7oh?schema=public
      ARCHIVE_DIR: /data/archive
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - archive_data:/data/archive
    command: npm run bot:prod

volumes:
  postgres_data:
  # Full-message-archive storage: bot writes, web reads (downloads).
  archive_data:
