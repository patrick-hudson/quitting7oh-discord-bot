name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Verify: install deps + lint outside the Docker build so we fail
      # fast on lockfile/lint issues without paying for the full image build.
      # The Docker build re-runs `npm ci` internally; this step is cheap
      # because actions/setup-node caches ~/.npm by lockfile hash.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # --- Image build + push to GHCR ---
      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value={{date 'YYYY.MM.DD'}}.${{ github.run_number }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Image pushed to GHCR"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Pull on the Lightsail host:**"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest"
            echo "# or pin to this build:"
            echo "docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
